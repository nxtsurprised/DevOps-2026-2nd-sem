server {
    listen 80;
    server_name localhost;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /health {
        proxy_pass http://127.0.0.1:5000/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /db-check {
        proxy_pass http://127.0.0.1:5000/db-check;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
