services:
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: compose_web_container
    ports:
      - "8080:80"
    volumes:
      - ./web/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web/app/config/app-config.json:/app/config/app-config.json:ro
    environment:
      APP_CONFIG_PATH: /app/config/app-config.json
      DB_HOST: new_db
      DB_PORT: "5432"
      DB_NAME: student_db
      DB_USER: student_user
      DB_PASSWORD: student_password
    depends_on:
      db:
        condition: service_healthy
    networks:
      compose_task_network:
        ipv4_address: 10.10.10.10

  db:
    image: postgres:16
    container_name: compose_db_container
    environment:
      POSTGRES_DB: student_db
      POSTGRES_USER: student_user
      POSTGRES_PASSWORD: student_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U student_user -d student_db"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      compose_task_network:
        ipv4_address: 10.10.10.11
        aliases:
          - new_db
          - dev_db

networks:
  compose_task_network:
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.10.0/28

volumes:
  postgres_data:
